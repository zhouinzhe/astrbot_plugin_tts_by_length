name: astrbot_plugin_fish_tts
display_name: Fish TTS优化
short_desc: Fish Audio 语音优化：短句转语音、长文发文字，支持 S2 情绪标签、多音色切换；控制台页面可改全部设置、管理和试听音色，手机也好用。
desc: Fish TTS优化：直连 Fish Audio（可走自建反代），短句开口说、长文发文字；支持 S2 情绪标签 [happy] [whispering]，发文字时自动去标签；可保存多个带备注的音色 ID 并随时切换；插件的「控制台」页面里能管理、试听音色，也能修改全部设置（手机上同样好用）；定时主动任务发出的消息同样会转语音、去标签；另带语音记忆，让大模型知道自己发过什么语音、被引用的是哪一句。
version: 3.5.1
astrbot_version: ">=4.26.0"
author: zhouinzhe
